<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ThumbsApp · GETTR‑style restructure · original identity</title>
  <!-- Google Fonts (Inter, Space Grotesk) & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- RESET & VARIABLES (ThumbsApp identity, no gettr colors) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* ThumbsApp unique palette – not copying gettr, but modern */
      --bg-body: #f4f6fa;
      --bg-surface: #ffffff;
      --bg-sidebar: #ffffff;
      --text-primary: #14171a;
      --text-secondary: #5b6775;
      --accent-blue: #2c7be5;
      --accent-green: #1db954;
      --accent-purple: #7c4dff;
      --border-light: #eaeef2;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.05);
      --radius-card: 20px;
      --radius-btn: 30px;
      --header-height: 0px; /* no top header – left sidebar is fixed */
      --transition: all 0.15s ease;
    }

    .dark {
      --bg-body: #0b0e12;
      --bg-surface: #1a1d21;
      --bg-sidebar: #1a1d21;
      --text-primary: #eef2f5;
      --text-secondary: #9aa9b8;
      --border-light: #2c333a;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.6);
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.5;
      transition: background-color 0.2s, color 0.2s;
      min-height: 100vh;
    }

    /* ---------- THREE‑COLUMN GETTR‑LIKE STRUCTURE ---------- */
    .gettr-layout {
      display: grid;
      grid-template-columns: 300px 1fr 340px;
      max-width: 1420px;
      margin: 0 auto;
      padding: 0 20px;
      gap: 24px;
      min-height: 100vh;
    }

    /* ----- LEFT SIDEBAR (fixed, scroll‑independent, ThumbsApp identity) ----- */
    .left-rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      box-shadow: var(--shadow-sm);
    }

    .left-rail::-webkit-scrollbar {
      width: 6px;
    }

    /* ThumbsApp logo (original) */
    .logo-thumbs {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 28px;
      padding-left: 12px;
      background: linear-gradient(145deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* profile summary (left rail) */
    .profile-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px 20px 12px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 20px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.4rem;
      flex-shrink: 0;
      background-size: cover;
    }

    .profile-mini .info h4 {
      font-size: 1rem;
      font-weight: 700;
    }

    .profile-mini .info span {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* navigation menu (exactly gettr style: vertical, icons + text) */
    .nav-menu-vertical {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 28px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
      transition: var(--transition);
      cursor: pointer;
    }

    .nav-item i {
      font-size: 1.4rem;
      width: 28px;
      color: var(--text-secondary);
    }

    .nav-item:hover {
      background: rgba(44, 123, 229, 0.08);
    }

    .nav-item.active {
      color: var(--accent-blue);
    }

    .nav-item.active i {
      color: var(--accent-blue);
    }

    /* create post button (like gettr +) */
    .create-post-btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 24px;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 24px 0;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 6px 14px rgba(44,123,229,0.3);
    }

    .create-post-btn:hover {
      background: #1a5cb0;
      transform: scale(1.02);
    }

    /* left footer / settings etc */
    .left-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
      font-size: 0.9rem;
    }

    .left-footer .nav-item {
      font-size: 0.95rem;
      padding: 10px 12px;
    }

    /* ----- MAIN FEED (center column) ----- */
    .main-feed {
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* post creation box (like gettr's composer) */
    .composer-card {
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-light);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .composer-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .composer-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .composer-input {
      flex: 1;
      background: var(--bg-body);
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 14px 18px;
      font-size: 1rem;
      color: var(--text-primary);
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--accent-blue);
    }

    .composer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      margin-top: 16px;
      padding-left: 64px;
    }

    .media-btn {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 30px;
    }

    .media-btn:hover {
      background: rgba(44,123,229,0.08);
    }

    .post-btn {
      background: var(--accent-blue);
      border: none;
      color: white;
      font-weight: 600;
      padding: 8px 28px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* feed post cards */
    .post-card {
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-light);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .post-header {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .post-author-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .post-author h4 {
      font-weight: 700;
      font-size: 1rem;
    }

    .post-author span {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .post-content {
      margin-bottom: 16px;
      font-size: 1rem;
    }

    /* media placeholder */
    .post-media {
      background: var(--bg-body);
      border-radius: 18px;
      height: 200px;
      margin: 14px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      border: 1px dashed var(--border-light);
    }

    .post-stats {
      display: flex;
      gap: 24px;
      margin: 16px 0 8px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .post-actions-row {
      display: flex;
      gap: 12px;
      border-top: 1px solid var(--border-light);
      padding-top: 16px;
      margin-top: 8px;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: none;
      padding: 10px;
      border-radius: 40px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(44,123,229,0.06);
      color: var(--accent-blue);
    }

    /* load more */
    .load-more {
      text-align: center;
      padding: 20px;
      color: var(--accent-blue);
      font-weight: 500;
      cursor: pointer;
    }

    /* ----- RIGHT SIDEBAR (Universal News / Trending – GETTR style) ----- */
    .right-rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-light);
      padding: 24px 20px;
      scrollbar-width: thin;
    }

    /* category tabs */
    .trending-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 12px;
    }

    .tab {
      padding: 6px 16px;
      border-radius: 40px;
      background: var(--bg-body);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .tab.active {
      background: var(--accent-blue);
      color: white;
    }

    /* news card (ranked / gettr style) */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .news-card {
      background: var(--bg-body);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: var(--transition);
    }

    .news-card:hover {
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    .news-rank {
      font-weight: 700;
      color: var(--accent-blue);
      font-size: 1.2rem;
      margin-right: 12px;
    }

    .news-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .news-meta {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .hashtags {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hashtag {
      background: rgba(44,123,229,0.1);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-weight: 500;
    }

    /* AI Wiki section (compact, integrated in right rail) */
    .wiki-ai-card {
      margin-top: 32px;
      background: var(--bg-body);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border-light);
    }

    .wiki-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .wiki-messages {
      background: var(--bg-surface);
      border-radius: 16px;
      padding: 12px;
      height: 140px;
      overflow-y: auto;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .wiki-input-area {
      display: flex;
      gap: 10px;
    }

    .wiki-input-area input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 40px;
      padding: 10px 16px;
      outline: none;
      color: var(--text-primary);
    }

    .wiki-input-area button {
      background: var(--accent-blue);
      border: none;
      border-radius: 40px;
      padding: 0 18px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* utility */
    .spinner {
      border: 3px solid var(--border-light);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* dark mode toggle (simple) */
    .dark-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* responsive */
    @media (max-width: 1100px) {
      .gettr-layout {
        grid-template-columns: 280px 1fr 300px;
      }
    }

    @media (max-width: 900px) {
      .gettr-layout {
        grid-template-columns: 1fr;
      }
      .left-rail,
      .right-rail {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="gettr-layout">
    <!-- LEFT SIDEBAR (fixed, scroll independent, ThumbsApp identity) -->
    <aside class="left-rail">
      <div class="logo-thumbs">ThumbsApp</div>

      <!-- Profile section (original) -->
      <div class="profile-mini">
        <div class="avatar" id="leftAvatar">P</div>
        <div class="info">
          <h4 id="leftUserName">ProGamer</h4>
          <span>@progamer · 2.4K followers</span>
        </div>
      </div>

      <!-- Navigation links (GETTR style vertical) -->
      <div class="nav-menu-vertical">
        <div class="nav-item active" onclick="app.navigate('home')"><i class="fas fa-home"></i> Home</div>
        <div class="nav-item" onclick="app.navigate('explore')"><i class="fas fa-hashtag"></i> Explore</div>
        <div class="nav-item" onclick="app.showNotif()"><i class="fas fa-bell"></i> Notifications</div>
        <div class="nav-item" onclick="app.showMessages()"><i class="fas fa-envelope"></i> Messages</div>
        <div class="nav-item" onclick="app.showSaved()"><i class="fas fa-bookmark"></i> Saved</div>
        <div class="nav-item" onclick="app.showSettings()"><i class="fas fa-cog"></i> Settings</div>
      </div>

      <!-- Post/Create button (big) -->
      <button class="create-post-btn" onclick="app.openCreateModal()"><i class="fas fa-plus-circle"></i> Post</button>

      <!-- extra footer items (light/dark, logout) -->
      <div class="left-footer">
        <div class="nav-item dark-toggle" onclick="app.toggleDarkMode()"><i class="fas fa-moon"></i> Dark mode</div>
        <div class="nav-item" onclick="app.logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
      </div>
    </aside>

    <!-- MAIN FEED (center column) -->
    <main class="main-feed" id="mainFeed">
      <!-- post creation box at top -->
      <div class="composer-card">
        <div class="composer-row">
          <div class="composer-avatar" id="composerAvatar">P</div>
          <input type="text" class="composer-input" placeholder="What's happening? Share a challenge..." id="postInputField" onclick="app.openCreateModal()">
        </div>
        <div class="composer-actions">
          <label class="media-btn"><i class="fas fa-image"></i> Media</label>
          <button class="post-btn" onclick="app.quickPost()">Post</button>
        </div>
      </div>

      <!-- dynamic feed posts -->
      <div id="feedPostsContainer">
        <!-- posts will be injected via JS -->
        <div class="spinner"></div>
      </div>
      <div class="load-more" onclick="app.loadMorePosts()" id="loadMoreBtn">Load more posts ↓</div>
    </main>

    <!-- RIGHT SIDEBAR (Universal News / Wiki AI) -->
    <aside class="right-rail">
      <!-- category tabs like GETTR -->
      <div class="trending-tabs">
        <span class="tab active" data-tab="trending">Trending</span>
        <span class="tab" data-tab="tech">Tech</span>
        <span class="tab" data-tab="sports">Sports</span>
        <span class="tab" data-tab="world">World</span>
      </div>

      <!-- Trending news list (GETTR style compact) -->
      <div class="news-list" id="trendingNewsContainer">
        <!-- dynamic -->
      </div>

      <!-- WIKI AI SECTION (fully functional, GETTR right rail integrated) -->
      <div class="wiki-ai-card">
        <div class="wiki-header">
          <i class="fas fa-robot" style="color: var(--accent-blue);"></i>
          <span>Thumbs Wiki AI</span>
        </div>
        <div class="wiki-messages" id="wikiMessages">
          <div><strong>AI:</strong> Ask me anything about gaming, strategies...</div>
        </div>
        <div class="wiki-input-area">
          <input type="text" id="wikiInput" placeholder="e.g., reaction duel tips">
          <button onclick="app.askWiki()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>

      <!-- extra hashtags preview -->
      <div style="margin-top: 20px;">
        <div class="hashtags">
          <span class="hashtag">#ThumbsCup</span>
          <span class="hashtag">#ReactionDuel</span>
          <span class="hashtag">#SpeedChess</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- SIMPLE MODAL for creating post (GETTR style not heavy) -->
  <div id="createModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 2000;">
    <div style="background: var(--bg-surface); border-radius: 30px; max-width: 500px; width: 90%; padding: 2rem;">
      <h3 style="margin-bottom: 1rem;">Create challenge</h3>
      <input type="text" id="modalPostTitle" placeholder="Title" style="width:100%; padding:14px; border-radius:40px; border:1px solid var(--border-light); margin-bottom:1rem;">
      <input type="number" id="modalEntryFee" value="10" style="width:100%; padding:14px; border-radius:40px;">
      <div style="display:flex; gap:1rem; margin-top:2rem;">
        <button class="post-btn" onclick="app.createPostFromModal()">Publish</button>
        <button class="post-btn" style="background:transparent; color:var(--text-secondary);" onclick="app.closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- TOAST AREA -->
  <div style="position: fixed; bottom: 20px; right: 20px; z-index: 3000;" id="toastContainer"></div>

  <script>
    (function() {
      // ---------- THUMBSAPP CORE (original content, dynamic) ----------
      class ThumbsApp {
        constructor() {
          this.currentUser = { username: 'ProGamer', handle: '@progamer', avatar: 'P', balance: 2450 };
          this.posts = [
            { id: 1, author: 'ProGamer', handle: '@progamer', content: 'Just won 100 THB in Reaction Duel! 🔥', media: null, likes: 24, comments: 3, shares: 1, timestamp: Date.now() - 7200000 },
            { id: 2, author: 'GameMaster', handle: '@gamemaster', content: 'Speed chess tournament starts in 1h. Entry 20 THB.', media: 'video', likes: 45, comments: 12, shares: 7, timestamp: Date.now() - 3600000 },
            { id: 3, author: 'NoobSlayer', handle: '@noobslayer', content: 'Anyone up for a memory match?', media: null, likes: 8, comments: 2, shares: 0, timestamp: Date.now() - 1800000 }
          ];
          this.postOffset = 0;
          this.pageSize = 3;
          // trending news (original)
          this.news = [
            { rank: 1, title: 'ProGamer wins 10k THB Championship', category: 'Trending', hashtags: ['#esports', '#thumbs'], source: 'Gaming Post', time: '2h' },
            { rank: 2, title: 'Reaction Duel 2.0 update drops tomorrow', category: 'Tech', hashtags: ['#reactionduel'], source: 'Thumbs Insider', time: '5h' },
            { rank: 3, title: 'Speed Chess Grandmaster joins Thumbs', category: 'Sports', hashtags: ['#chess'], source: 'SportsWire', time: '7h' },
            { rank: 4, title: 'Memory Match world record broken', category: 'World', hashtags: ['#memory'], source: 'BBC Gaming', time: '1d' },
            { rank: 5, title: 'New anti-cheat system deployed', category: 'Tech', hashtags: ['#fairplay'], source: 'TechCrunch', time: '1d' },
          ];
          this.wikiChat = [{ role: 'ai', text: 'I can answer gaming questions!' }];
          this.init();
        }

        init() {
          this.renderFeed();
          this.renderTrendingNews('Trending');
          this.setupTabs();
          this.updateLeftProfile();
        }

        updateLeftProfile() {
          document.getElementById('leftAvatar').innerText = this.currentUser.avatar;
          document.getElementById('leftUserName').innerText = this.currentUser.username;
          document.getElementById('composerAvatar').innerText = this.currentUser.avatar;
        }

        // feed rendering
        renderFeed() {
          let container = document.getElementById('feedPostsContainer');
          let postsToShow = this.posts.slice(0, this.postOffset + this.pageSize);
          if (postsToShow.length === 0) {
            container.innerHTML = '<div class="post-card">No posts yet. Create one!</div>';
            return;
          }
          let html = '';
          postsToShow.forEach(p => {
            html += `
              <div class="post-card">
                <div class="post-header">
                  <div class="post-author-avatar">${p.author[0]}</div>
                  <div class="post-author">
                    <h4>${p.author} <span style="font-weight:normal;">${p.handle}</span></h4>
                    <span>${this.formatTime(p.timestamp)}</span>
                  </div>
                </div>
                <div class="post-content">${p.content}</div>
                ${p.media ? '<div class="post-media"><i class="fas fa-play-circle"></i> Media preview (simulated)</div>' : ''}
                <div class="post-stats">
                  <span class="stat"><i class="fas fa-heart"></i> ${p.likes}</span>
                  <span class="stat"><i class="fas fa-comment"></i> ${p.comments}</span>
                  <span class="stat"><i class="fas fa-retweet"></i> ${p.shares}</span>
                </div>
                <div class="post-actions-row">
                  <button class="action-btn" onclick="app.likePost(${p.id})"><i class="fas fa-heart"></i> Like</button>
                  <button class="action-btn" onclick="app.commentPost(${p.id})"><i class="fas fa-comment"></i> Comment</button>
                  <button class="action-btn" onclick="app.sharePost(${p.id})"><i class="fas fa-share"></i> Share</button>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
        }

        loadMorePosts() {
          if (this.postOffset + this.pageSize < this.posts.length) {
            this.postOffset += this.pageSize;
          } else {
            this.postOffset = this.posts.length; // no more
          }
          this.renderFeed();
        }

        likePost(id) {
          let post = this.posts.find(p => p.id === id);
          if (post) { post.likes++; this.renderFeed(); this.showToast('Liked!'); }
        }

        commentPost(id) { this.showToast('Comment window (demo)'); }
        sharePost(id) { this.showToast('Shared (demo)'); }

        quickPost() {
          this.showToast('Use the create button or modal');
        }

        openCreateModal() {
          document.getElementById('createModal').style.display = 'flex';
        }

        closeModal() {
          document.getElementById('createModal').style.display = 'none';
        }

        createPostFromModal() {
          let title = document.getElementById('modalPostTitle').value.trim();
          let fee = document.getElementById('modalEntryFee').value;
          if (!title) title = 'New challenge';
          let newPost = {
            id: Date.now(),
            author: this.currentUser.username,
            handle: '@' + this.currentUser.username.toLowerCase(),
            content: `${title} · entry ${fee} THB`,
            media: null,
            likes: 0,
            comments: 0,
            shares: 0,
            timestamp: Date.now()
          };
          this.posts.unshift(newPost);
          this.postOffset = 0;
          this.renderFeed();
          this.closeModal();
          this.showToast('Post created');
        }

        // trending news rendering
        renderTrendingNews(category = 'Trending') {
          let filtered = this.news.filter(n => category === 'Trending' ? true : n.category === category);
          let container = document.getElementById('trendingNewsContainer');
          container.innerHTML = filtered.map(n => `
            <div class="news-card" onclick="app.showToast('${n.title}')">
              <div style="display:flex; align-items:center; gap:12px;">
                <span class="news-rank">#${n.rank}</span>
                <div>
                  <div class="news-title">${n.title}</div>
                  <div class="news-meta"><span>${n.source}</span> <span>${n.time}</span></div>
                  <div class="hashtags">${n.hashtags.map(h => `<span class="hashtag">${h}</span>`).join('')}</div>
                </div>
              </div>
            </div>
          `).join('');
        }

        setupTabs() {
          document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
              document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
              tab.classList.add('active');
              this.renderTrendingNews(tab.innerText);
            });
          });
        }

        // wiki AI functional
        askWiki() {
          let input = document.getElementById('wikiInput');
          let q = input.value.trim();
          if (!q) return;
          let msgBox = document.getElementById('wikiMessages');
          msgBox.innerHTML += `<div><strong>You:</strong> ${q}</div>`;
          input.value = '';
          // Simulate AI response (original logic)
          setTimeout(() => {
            let ans = "I found: Reaction duel average 180ms. Use peripheral vision.";
            msgBox.innerHTML += `<div><strong>AI:</strong> ${ans}</div>`;
            msgBox.scrollTop = msgBox.scrollHeight;
          }, 400);
        }

        // navigation (demo)
        navigate(page) {
          this.showToast(`Navigating to ${page} (demo)`);
        }

        showNotif() { this.showToast('🔔 Notifications (demo)'); }
        showMessages() { this.showToast('📨 Messages (demo)'); }
        showSaved() { this.showToast('Saved items'); }
        showSettings() { this.showToast('Settings'); }

        toggleDarkMode() {
          document.body.classList.toggle('dark');
        }

        logout() {
          this.showToast('Logged out (demo)');
        }

        showToast(msg) {
          let toast = document.createElement('div');
          toast.className = 'toast';
          toast.style.background = 'var(--bg-surface)';
          toast.style.borderLeft = '4px solid var(--accent-blue)';
          toast.style.padding = '12px 24px';
          toast.style.borderRadius = '40px';
          toast.style.boxShadow = 'var(--shadow-md)';
          toast.style.marginBottom = '8px';
          toast.innerText = msg;
          document.getElementById('toastContainer').appendChild(toast);
          setTimeout(() => toast.remove(), 2000);
        }

        formatTime(ts) {
          let sec = Math.floor((Date.now() - ts) / 1000);
          if (sec < 60) return 'now';
          if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
          return Math.floor(sec / 3600) + 'h ago';
        }
      }

      window.app = new ThumbsApp();
    })();
  </script>
</body>
</html>
